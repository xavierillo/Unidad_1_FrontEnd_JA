<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Cliente</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    body {
      background: #f5f7fb;
    }

    .register-container {
      max-width: 520px;
      margin: 40px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .form-error {
      color: #dc3545;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .form-success {
      color: #198754;
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <main class="register-container p-4 p-md-5">
    <article>
      <header class="text-center mb-4">
        <h1 class="h3 fw-bold">Registro de Cliente</h1>
        <p class="text-muted small mb-0">
          Crea tu cuenta para acceder a la plataforma
        </p>
      </header>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="full_name" class="form-label fw-semibold">Nombre completo</label>
          <input
            type="text"
            class="form-control"
            id="full_name"
            placeholder="Ej: Juan Pérez Soto"
          >
          <div id="full_nameError" class="form-error"></div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Correo electrónico</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="tu@correo.com"
          >
          <div id="emailError" class="form-error"></div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Mínimo 8 caracteres"
          >
          <div id="passwordError" class="form-error"></div>
        </div>

        <div class="mb-3">
          <label for="birth_date" class="form-label fw-semibold">Fecha de nacimiento</label>
          <input
            type="date"
            class="form-control"
            id="birth_date"
          >
          <div id="birth_dateError" class="form-error"></div>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="plays_sport">
          <label class="form-check-label" for="plays_sport">
            ¿Practicas algún deporte?
          </label>
        </div>

        <div class="mb-3">
          <label for="sport_name" class="form-label fw-semibold">Deporte</label>
          <input
            type="text"
            class="form-control"
            id="sport_name"
            placeholder="Ej: football"
          >
          <div id="sport_nameError" class="form-error"></div>
        </div>

        <div class="mb-3">
          <label for="frequency_per_week" class="form-label fw-semibold">Frecuencia por semana</label>
          <input
            type="number"
            class="form-control"
            id="frequency_per_week"
            min="0"
            placeholder="Ej: 3"
          >
          <div id="frequency_per_weekError" class="form-error"></div>
        </div>

        <div id="formMessage" class="mb-3"></div>

        <button type="submit" class="btn btn-primary w-100">
          Registrarme
        </button>

        <button
          type="button"
          class="btn btn-light border w-100 mt-3"
          onclick="window.location.href='./loginCliente.html'"
        >
          Volver al Login
        </button>
      </form>

      <footer class="text-center mt-4 small">
        ¿Ya tienes cuenta? <a href="./loginCliente.html">Inicia sesión</a>
      </footer>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/registerCliente.js"></script>
</body>
</html>
