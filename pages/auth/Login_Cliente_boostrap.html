<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/loginClienteB.css">
</head>
<body>
    <main class="login-container p-5">
        <article>
            <header class="text-center mb-4">
                <h1 class="login-header">Inicia Sesión</h1>
                <p class="text-muted small">Accede a tu cuenta de cliente</p>
            </header>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="tu@correo.com" >
                    <div id="emailError" class="text-danger small mt-1"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" >
                    <div id="passwordError" class="text-danger small mt-1"></div>
                </div>

                <div id="loginMessage" class="text-danger small mb-3"></div>

                <button type="submit" class="btn btn-primary btn-ingresar w-100">Ingresar</button>

                <div class="d-flex justify-content-between mt-3 small">
                    <a href="#recuperar">¿Olvidaste tu contraseña?</a>
                    <a href="#registrarse">Registrarse</a>
                </div>

                <button type="button" class="btn btn-light btn-inicio w-100 border mt-3" onclick="window.location.href='../../index.html'">
                    Volver a Inicio
                </button>
            </form>

            <footer class="text-center mt-4 small">
                ¿No tienes cuenta? <a href="#registrarse">Crear una nueva</a>
            </footer>
        </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/login.js"></script>
</body>
</html>
